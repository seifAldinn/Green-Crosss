<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up | GreenCross Pharmacy</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 0.5rem; color: var(--primary-color);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    <span>GreenCross</span>
                </a>
            </div>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="index.html#services">Services</a>
                <a href="index.html#pricing">Pricing</a>
                <a href="index.html#contact">Contact</a>
            </nav>
            
            <div class="header-actions">
                <a href="index.html" class="btn-outline">Back to Home</a>
            </div>
        </div>
    </header>

    <!-- Auth Section -->
    <main class="auth-section">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-signin">Sign In</div>
                <div class="auth-tab" id="tab-signup">Sign Up</div>
            </div>

            <!-- Sign In Form -->
            <form class="auth-form" id="form-signin">
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="••••••••" required>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary-color); font-weight: 600;">Forgot password?</a>
                </div>
                <button type="submit" class="btn-primary btn-full" style="padding: 0.75rem;">Sign In</button>
                <div class="auth-footer">
                    Don't have an account? <a href="#" id="link-signup">Create one</a>
                </div>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form class="auth-form" id="form-signup" style="display: none;">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="••••••••" required>
                </div>
                <div style="font-size: 0.875rem; color: var(--text-muted);">
                    By signing up, you agree to our <a href="#" style="color: var(--primary-color);">Terms of Service</a> and <a href="#" style="color: var(--primary-color);">Privacy Policy</a>.
                </div>
                <button type="submit" class="btn-primary btn-full" style="padding: 0.75rem;">Create Account</button>
                <div class="auth-footer">
                    Already have an account? <a href="#" id="link-signin">Sign in</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 GreenCross Pharmacy. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const tabSignIn = document.getElementById('tab-signin');
        const tabSignUp = document.getElementById('tab-signup');
        const formSignIn = document.getElementById('form-signin');
        const formSignUp = document.getElementById('form-signup');
        const linkSignUp = document.getElementById('link-signup');
        const linkSignIn = document.getElementById('link-signin');

        function showSignIn() {
            tabSignIn.classList.add('active');
            tabSignUp.classList.remove('active');
            formSignIn.style.display = 'flex';
            formSignUp.style.display = 'none';
        }

        function showSignUp() {
            tabSignUp.classList.add('active');
            tabSignIn.classList.remove('active');
            formSignUp.style.display = 'flex';
            formSignIn.style.display = 'none';
        }

        tabSignIn.addEventListener('click', showSignIn);
        tabSignUp.addEventListener('click', showSignUp);
        linkSignUp.addEventListener('click', (e) => { e.preventDefault(); showSignUp(); });
        linkSignIn.addEventListener('click', (e) => { e.preventDefault(); showSignIn(); });

        // Prevent form submission for demo
        formSignIn.addEventListener('submit', (e) => e.preventDefault());
        formSignUp.addEventListener('submit', (e) => e.preventDefault());
    </script>
</body>
</html>
